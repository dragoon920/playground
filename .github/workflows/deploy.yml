name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo git config --global --add safe.directory /opt/playground
            cd /opt/playground
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml build
            # Refresh frontend deps in the node_modules volume (bind mount hides image modules)
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --entrypoint npm web install
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
